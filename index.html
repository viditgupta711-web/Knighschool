 won game."},{id:3,name:"Tactics",band:"800\u20131200",glyph:"\u2657",tint:"var(--t3)",intro:"The patterns that win material. This is where ratings jump fastest."},{id:4,name:"Real Chess",band:"1200\u20131600",glyph:"\u2656",tint:"var(--t4)",intro:"Plans, pawn structures and endgame technique."},{id:5,name:"Club Strength",band:"1600\u20131900",glyph:"\u2655",tint:"var(--t5)",intro:"Calculation, prophylaxis and converting advantages under pressure."}],zu=[{id:"t1-board",tier:1,title:"The board",body:"Eight columns called files (a\u2013h) and eight rows called ranks (1\u20138). Every square has a name: the file letter first, then the rank number. Set the board so each player has a light square in their bottom-right corner \u2014 'white on the right'.",points:["Files go up and down: a, b, c, d, e, f, g, h","Ranks go across: 1 at White's end, 8 at Black's","e4 means the e-file, 4th rank"],mode:"explore",fen:ma,note:"Tap any piece to see where it can go. The square names run along the edges."},{id:"t1-pawn",tier:1,title:"The pawn",body:"Pawns only walk forwards, one square at a time. On their very first move they may go two. They never capture straight ahead \u2014 they capture one square diagonally forwards. A pawn that reaches the far end promotes into any piece you like (almost always a queen).",points:["Moves straight, captures diagonally","First move: one or two squares","Reaches the end = promotes","Pawns can never move backwards"],mode:"explore",fen:"7k/8/8/2p1p3/3P4/8/8/K7 w - - 0 1",note:"Try d4-d5, and try capturing on c5 or e5."},{id:"t1-rook",tier:1,title:"The rook",body:"The rook slides in straight lines \u2014 along its file or along its rank \u2014 as far as it likes, until something blocks it. Rooks are worth 5 pawns. They love long open lines with nothing in the way.",points:["Straight lines only, any distance","Cannot jump over anything","Worth about 5 pawns"],mode:"explore",fen:"7k/8/8/3R4/8/8/8/K7 w - - 0 1",note:"Notice how many squares a rook controls from the middle."},{id:"t1-bishop",tier:1,title:"The bishop",body:"The bishop slides diagonally, any distance. Here is the strange thing: a bishop that starts on a light square stays on light squares for the entire game. It can never touch a dark square. That is why having both bishops is so useful \u2014 together they cover everything.",points:["Diagonals only, any distance","Stuck on one colour forever","Worth about 3 pawns"],mode:"explore",fen:"7k/8/8/3B4/8/8/8/K7 w - - 0 1",note:"Count the squares. Now imagine the bishop on a corner instead."},{id:"t1-queen",tier:1,title:"The queen",body:"The queen moves like a rook and a bishop combined: straight lines and diagonals, any distance. She is the strongest piece, worth about 9 pawns. Because she is so valuable, be careful \u2014 a queen chased around by little pieces is a queen in trouble.",points:["Rook moves + bishop moves","Worth about 9 pawns","Do not bring her out too early"],mode:"explore",fen:"7k/8/8/3Q4/8/8/8/K7 w - - 0 1",note:"From the centre a queen touches 27 squares."},{id:"t1-king",tier:1,title:"The king",body:"The king moves one square in any direction. He has no point value because you cannot trade him \u2014 if he cannot escape attack, the game is over. Kings can never stand next to each other, because that would mean moving into attack.",points:["One square, any direction","Can never move into check","In the endgame the king becomes a strong attacker"],mode:"explore",fen:"8/8/8/3K4/8/8/8/7k w - - 0 1",note:"Try to walk the white king next to the black one \u2014 it is not allowed."},{id:"t1-knight",tier:1,title:"The knight",body:"The knight moves in an L: two squares one way, then one square sideways. It is the only piece that jumps over others, which makes it deadly in crowded positions. A knight always lands on the opposite colour square from the one it left.",points:["Two-then-one, an L shape","Jumps over anything in the way","Worth about 3 pawns","Knights are terrible in corners \u2014 a knight on the rim is dim"],mode:"explore",fen:"7k/8/8/3N4/8/8/8/K7 w - - 0 1",note:"Compare: from d5 it reaches 8 squares. From a1 it reaches 2."},{id:"t1-check",tier:1,title:"Check",body:"When a piece attacks the enemy king, that is check. You must deal with it immediately \u2014 you are not allowed to ignore it and do something else. There are exactly three ways out: move the king, block the attack, or capture the attacker. Remember them as move, block, take.",points:["Move the king to a safe square","Block the line with another piece","Capture the checking piece","You may never leave your own king in check"],mode:"explore",fen:"4k3/8/8/8/8/8/4R3/4K3 w - - 0 1",note:"Play Re2-e7 or Re2-e8 and look at Black's only legal replies."},{id:"t1-mate",tier:1,title:"Checkmate",body:"Checkmate is check with no way out \u2014 no move, no block, no capture. The game ends there and then; the king is never actually taken. Every game you win will end in a checkmate pattern, and most patterns repeat over and over, which is why they are worth learning by name.",points:["Check + no legal escape = game over","The king is never captured","Patterns repeat: learn them once, use them forever"],mode:"solve",fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",task:"White to play. Find checkmate in one move.",accept:"mate",hint:"Black's king is boxed in by his own pawns. Which empty line leads to him?",answer:"Ra8#"},{id:"t1-stalemate",tier:1,title:"Stalemate",body:"Stalemate is the frustrating one. If the player to move is NOT in check but has no legal move at all, the game is an immediate draw \u2014 even if one side has a whole army left. When you are winning easily, always leave your opponent a legal move.",points:["Not in check + no legal move = draw","It saves the losing side, so watch for it","When winning: give check or give them a square"],mode:"explore",fen:"7k/5Q2/6K1/8/8/8/8/8 w - - 0 1",note:"Qg7 is checkmate. But Qe6?? is stalemate \u2014 a draw from a completely winning position. Try both."},{id:"t1-castle",tier:1,title:"Castling",body:"Castling is the only move where two pieces move at once. The king slides two squares towards a rook, and that rook hops over to the far side of him. It tucks your king safely into a corner and brings a rook towards the middle \u2014 two useful jobs in one move.",points:["The squares between king and rook must be empty","Neither the king nor that rook may have moved before","You cannot castle out of check","The king cannot pass through or land on an attacked square"],mode:"explore",fen:"r3k2r/pppppppp/8/8/8/8/PPPPPPPP/R3K2R w KQkq - 0 1",note:"Tap the king. Both castles are available \u2014 short (O-O) and long (O-O-O)."},{id:"t1-ep",tier:1,title:"En passant",body:"The rarest rule. If a pawn uses its two-square first move to slip past an enemy pawn, that enemy pawn may capture it as if it had only moved one square. You must do it immediately \u2014 wait one move and the chance is gone forever.",points:["Only pawns, only against a two-square pawn move","The capturing pawn must be on its 5th rank","Must be played on the very next move"],mode:"explore",fen:"4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 2",note:"Black has just played d7-d5. Tap the e5 pawn: exd6 is available."},{id:"t1-notation",tier:1,title:"Writing moves down",body:"Each piece has a letter: K king, Q queen, R rook, B bishop, N knight (K was taken). Pawns get no letter. Write the piece letter and the destination square: Nf3 means knight to f3. An x means a capture, + means check, # means checkmate.",points:["Nf3 = knight to f3","exd5 = the e-pawn captures on d5","O-O = short castle, O-O-O = long castle","+ is check, # is checkmate"],mode:"explore",fen:ma,note:"Make a few moves and watch the move list build up on the right."},{id:"t2-values",tier:2,title:"What the pieces are worth",body:"Pawn 1, knight 3, bishop 3, rook 5, queen 9. These numbers are a rough guide, not a law, but they settle most decisions instantly. Two rooks (10) are usually better than a queen (9). A knight and two pawns (5) roughly balance a rook (5).",points:["\u26591  \u26583  \u26573  \u26565  \u26559","Bishop is a fraction better than knight in open positions","The king has no value \u2014 he is priceless"],mode:"read"},{id:"t2-hanging",tier:2,title:"Do not hang pieces",body:"A hanging piece is one that is attacked and not defended \u2014 free material for your opponent. At beginner level, roughly nine games out of ten are decided by someone hanging something, not by a clever plan. Before every single move, ask: is the square I am moving to attacked? Is anything I am leaving behind now undefended?",points:["Attacked + undefended = hanging","Check every piece you own, not just the one you moved","The coach panel in Play mode will warn you when you hang something"],mode:"read"},{id:"t2-trades",tier:2,title:"Good trades and bad trades",body:"A trade is good when you come out ahead in value, or when it helps your position \u2014 trading pieces when you are ahead in material, or trading off your opponent's best attacker. It is bad when you give up a rook for a bishop, or when it opens lines towards your own king.",points:["Ahead in material? Trade pieces, keep pawns","Behind in material? Avoid trades, keep pieces on","Trade your bad pieces for their good ones"],mode:"solve",fen:"6k1/5ppp/8/3b4/8/8/5PPP/3R2K1 w - - 0 1",task:"White to play and win a piece.",accept:["Rxd5"],hint:"Is that bishop defended by anything?",answer:"Rxd5 \u2014 the bishop was undefended, so this is simply free."},{id:"t2-kq",tier:2,title:"Checkmate with king and queen",body:"The box method. Use the queen a knight's-move away from the enemy king to shrink the box he lives in, smaller and smaller, driving him to the edge. Then walk your own king up to support, and deliver mate. Careful: shrinking too fast causes stalemate.",points:["Queen a knight's move from their king shrinks the box","Push him to the edge, then bring your king","Mate needs the king's support \u2014 the queen alone cannot do it","Watch for stalemate every single move"],mode:"solve",fen:"7k/8/6K1/8/8/8/Q7/8 w - - 0 1",task:"White to play. Checkmate in one.",accept:"mate",hint:"Your king already guards g7 and h7. Where can the queen give check safely?",answer:"Qa8#"},{id:"t2-kr",tier:2,title:"Checkmate with king and rook",body:"Harder than the queen, and a genuine test. You cannot cut off and mate with the rook alone \u2014 you need your king opposite theirs, nose to nose with one square between. That is called the opposition. Then the rook delivers the blow.",points:["Cut the enemy king off with the rook","Walk your king up until it faces theirs with a gap","Rook checks along the line = mate"],mode:"solve",fen:"1k6/8/1K6/8/8/8/8/7R w - - 0 1",task:"White to play. Checkmate in one.",accept:"mate",hint:"Your kings are already facing each other. The rook only needs to reach the right rank.",answer:"Rh8#"},{id:"t2-kr2",tier:2,title:"Winning the opposition first",body:"Same ending, one move earlier. The rook cannot mate yet, because the black king still has an escape square. First take the opposition with your king, then mate. This is the whole technique in miniature: king first, rook second.",points:["If mate is not there yet, improve the king","Opposition means facing kings with one square between","Only then does the rook check become mate"],mode:"solve",fen:"k7/8/8/1K6/8/8/8/6R1 w - - 0 1",task:"White to play and mate in two moves. Find the first move.",accept:["Kb6"],hint:"A rook check right now lets the king slip out. Fix that first.",answer:"1.Kb6! and after the king moves, Rg8# follows."},{id:"t2-centre",tier:2,title:"Opening rule 1: take the centre",body:"The four middle squares \u2014 d4, e4, d5, e5 \u2014 are the high ground. Pieces in the centre reach more squares, and a pawn there cramps your opponent. Almost every good opening starts by putting a pawn on one of them.",points:["Open with 1.e4 or 1.d4","Central pawns give your pieces room","Control the centre before attacking the wings"],mode:"explore",fen:ma,note:"Play 1.e4 and count how many new squares your bishop and queen suddenly see."},{id:"t2-develop",tier:2,title:"Opening rule 2: develop your pieces",body:"Development means bringing knights and bishops off the back rank onto useful squares. Knights before bishops, usually \u2014 knights have fewer good squares so their choice is easier. Aim to get every minor piece out before you launch anything.",points:["Knights to f3/c3 (or f6/c6 for Black)","Bishops onto open diagonals","Do not move the same piece twice in the opening without a reason","Do not bring the queen out early \u2014 she gets chased"],mode:"explore",fen:ma,note:"Try 1.e4 e5 2.Nf3 Nc6 3.Bc4 Bc5 \u2014 this is the Italian Game."},{id:"t2-castleearly",tier:2,title:"Opening rule 3: castle early",body:"A king sitting in the centre while lines open around him is a king about to be checkmated. Castle within the first ten moves or so. Once castled, be reluctant to push the pawns in front of him \u2014 they are his shield.",points:["Castle by about move 10","Keep the three pawns in front of your king mostly still","An uncastled king is the number one cause of short losses"],mode:"read"},{id:"t2-scholars",tier:2,title:"Beating Scholar's Mate",body:"Almost every beginner meets this: the queen and bishop both aim at f7, the weakest square, and mate arrives on move four. It works exactly once. The defence is simple \u2014 develop a piece that guards f7, usually the knight to f6 or the pawn to g6.",points:["f7 and f2 are weak \u2014 only the king guards them at the start","...g6 blocks the queen, ...Nf6 hits her","Never answer an early queen sortie with a move that ignores it"],mode:"solve",fen:"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4",task:"White to play. Punish Black's careless last move \u2014 mate in one.",accept:"mate",hint:"Two white pieces are aiming at the same square. Which one?",answer:"Qxf7# \u2014 the queen is defended by the bishop on c4, so the king cannot take."},{id:"t2-fools",tier:2,title:"The shortest game there is",body:"Fool's Mate takes two moves. White opens with the two pawn moves that expose the diagonal to his own king, and Black mates instantly. Nobody plays it on purpose, but it teaches the lesson perfectly: pawn moves in front of your king are permanent, and they can open doors you cannot close.",points:["f- and g-pawn moves weaken the king badly","The h4\u2013e1 diagonal is the danger line","Pawns never move backwards, so a weakness is forever"],mode:"solve",fen:"rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq - 0 2",task:"Black to play. Checkmate in one.",accept:"mate",hint:"White's last two moves opened a diagonal straight to his king.",answer:"Qh4#"},{id:"t2-blundercheck",tier:2,title:"The three-second check",body:"Before you touch a piece, run one quick routine: checks, captures, threats. What checks can my opponent give? What can they capture? What are they threatening? Three seconds, every move. It is the single habit that separates a 400 from an 800, and it never stops being useful.",points:["Checks \u2014 captures \u2014 threats. In that order.","Do it after you pick your move, before you play it","Ask it about your opponent's position, not just your own"],mode:"read"},{id:"t3-fork",tier:3,title:"The fork",body:"One piece attacking two things at once. Your opponent can only save one. Knights are the great forkers because their attack cannot be blocked, and a knight check that also hits the queen is the classic. When the fork hits king and queen it has a name: the royal fork.",points:["Best with check \u2014 they must answer the check and lose the other piece","Knights fork with impunity; nothing can block an L","Look for enemy pieces on the same colour square"],mode:"solve",fen:"r3k3/8/8/3N4/8/8/8/6K1 w - - 0 1",task:"White to play and win the rook.",accept:["Nc7+"],hint:"Find the square that touches both the king and the rook.",answer:"Nc7+ forks e8 and a8. After the king moves, Nxa8."},{id:"t3-royalfork",tier:3,title:"The royal fork",body:"King and queen on the same knight-fork pattern. This wins on the spot, because the check must be answered and the queen then simply drops. Train your eye to spot squares that touch both \u2014 it becomes automatic surprisingly quickly.",points:["Check first, collect the queen second","Scan for enemy king and queen a knight's move apart","Also works with the queen forking king and rook"],mode:"solve",fen:"3q3k/8/8/6N1/8/8/8/6K1 w - - 0 1",task:"White to play and win the queen.",accept:["Nf7+"],hint:"One square touches both h8 and d8.",answer:"Nf7+ and after the king moves, Nxd8."},{id:"t3-queenfork",tier:3,title:"Double attack with the queen",body:"The queen forks too, and she does it along lines rather than in Ls. Look for a square from which she gives check on one diagonal and hits a loose piece on another. Loose pieces drop off \u2014 undefended pieces are the raw material of every double attack.",points:["Check on one line, capture on another","Hunt for undefended enemy pieces first, then find the square","'Loose pieces drop off' \u2014 LPDO"],mode:"solve",fen:"r5k1/6pp/8/8/8/8/8/3Q2K1 w - - 0 1",task:"White to play and win the rook.",accept:["Qd5+"],hint:"One square sees both g8 and a8.",answer:"Qd5+ hits the king and the a8 rook at the same time."},{id:"t3-pin",tier:3,title:"The pin",body:"A pin freezes a piece: if it moves, something more valuable behind it is exposed. When the thing behind is the king, the pinned piece legally cannot move at all \u2014 an absolute pin. Once a piece is pinned, pile more attackers onto it. It cannot run.",points:["Only rooks, bishops and queens can pin","Absolute pin: against the king, the piece is frozen by law","A pinned piece is a bad defender \u2014 it may not really be defending anything"],mode:"solve",fen:"4k3/3n4/4P3/8/8/8/8/3R3K w - - 0 1",task:"White to play and win a piece.",accept:["exd7+"],hint:"The knight is pinned against the king by the rook. What attacks it?",answer:"exd7+ \u2014 the knight was pinned and could never be defended properly."},{id:"t3-skewer",tier:3,title:"The skewer",body:"A pin in reverse. The valuable piece is in front; you attack it, it must move, and you capture the smaller one behind. Skewers against the king are decisive because the check cannot be ignored.",points:["Big piece in front, smaller behind","Check the front piece, take the back one","Look for enemy king and rook on the same line"],mode:"solve",fen:"r7/8/8/k7/8/8/8/1R4K1 w - - 0 1",task:"White to play and win the rook.",accept:["Ra1+"],hint:"Get onto the a-file with check.",answer:"Ra1+ \u2014 the king must leave the file, then Rxa8."},{id:"t3-discovered",tier:3,title:"Discovered attack",body:"Move one piece and a different piece behind it springs to life. Because the moving piece can go anywhere and do its own damage, discovered attacks are among the most powerful ideas in chess. The best version is a discovered check, where the opponent is forced to deal with the check and cannot answer the other threat.",points:["The piece that moves and the piece that attacks are different","Discovered check is nearly unanswerable","Set them up in advance: line up a rook or bishop behind a knight"],mode:"solve",fen:"3k4/8/8/5q2/3N4/8/8/3R3K w - - 0 1",task:"White to play and win the queen.",accept:["Nxf5+"],hint:"Moving the knight uncovers the rook. Can the knight also do something useful?",answer:"Nxf5+ \u2014 it captures the queen and uncovers check from the rook at once."},{id:"t3-backrank",tier:3,title:"The back rank",body:"A castled king with three untouched pawns in front is safe from most things \u2014 and completely helpless against a rook or queen arriving on the back rank. The cure is a luft ('air' in German): pushing one pawn to give the king an escape square, usually h6 or h3.",points:["Back-rank mate is the most common mate in real games","Give your king luft once the queens are off","Check your own back rank before every rook trade"],mode:"solve",fen:"3r2k1/5ppp/8/8/8/8/8/3RR1K1 w - - 0 1",task:"White to play. Checkmate in one.",accept:"mate",hint:"The black rook is the only defender of the back rank. It is also outnumbered.",answer:"Rxd8# \u2014 the second rook defends the first."},{id:"t3-smother",tier:3,title:"Smothered mate",body:"A king surrounded by his own pieces, mated by a lone knight. It looks like a magic trick and it is one of the prettiest patterns in chess. In full games it usually arrives after a queen sacrifice that forces the king's own rook into the corner.",points:["The king is trapped by his own army","Only a knight can deliver it \u2014 nothing else can jump in","Look for it whenever an enemy king is castled and cramped"],mode:"solve",fen:"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1",task:"White to play. Checkmate in one.",accept:"mate",hint:"The black king has no squares at all. He only needs to be checked.",answer:"Nf7#"},{id:"t3-arabian",tier:3,title:"The Arabian mate",body:"Rook and knight working together, one of the oldest recorded patterns \u2014 it appears in Arabic manuscripts a thousand years old. The knight covers the escape square and defends the rook; the rook delivers mate from right beside the king.",points:["Knight on f6 (or f3/c6/c3) plus rook on the 7th","The knight defends the rook, so the king cannot capture","Worth memorising \u2014 it appears constantly in tactics puzzles"],mode:"solve",fen:"7k/8/5N2/8/8/8/7R/6K1 w - - 0 1",task:"White to play. Checkmate in one.",accept:"mate",hint:"Bring the rook right next to the king. Is it defended?",answer:"Rh7# \u2014 the knight on f6 guards h7 and g8."},{id:"t3-ladder",tier:3,title:"The ladder mate",body:"Two rooks alone force mate against a bare king, and it is worth being able to do it in your sleep. One rook cuts off a rank, the other checks on the next one up, and the king is walked backwards to the edge. Never let a rook be captured \u2014 keep them far from the enemy king.",points:["One rook cuts, the other checks","Alternate: cut, check, cut, check","Keep both rooks away from the king so they cannot be taken"],mode:"solve",fen:"7k/8/8/8/8/8/R7/1R6 w - - 0 1",task:"White to play and mate in two. Find the first move.",accept:["Ra7"],hint:"Take away the whole 7th rank first. Then the other rook mates.",answer:"1.Ra7! Kg8 2.Rb8#"},{id:"t3-promotion",tier:3,title:"Promotion is a tactic",body:"A pawn one square from the end is worth far more than one pawn. Passed pawns must be pushed. And when you promote, remember you may choose any piece \u2014 very occasionally a knight is right, because it can give a check a queen cannot.",points:["A passed pawn on the 7th ties down a whole rook","Push passed pawns; do not sit on them","Underpromotion to a knight exists for forks and to dodge stalemate"],mode:"solve",fen:"8/1P6/8/8/8/8/1k6/6K1 w - - 0 1",task:"White to play and win.",accept:["b8=Q+","b8=Q"],hint:"Nothing is guarding the promotion square.",answer:"b8=Q+ \u2014 a new queen, with check."},{id:"t3-counting",tier:3,title:"Counting on a square",body:"Before you capture into a defended square, count. How many attackers do I have, how many defenders do they have, and in what order will the pieces come off? Capture only if you have more attackers, and take with your least valuable piece first.",points:["Attackers vs defenders, then check the values","Take with the cheapest piece first","A pinned defender is not really defending"],mode:"read"},{id:"t3-opposition",tier:3,title:"The opposition",body:"In king and pawn endings, the king who does NOT have to move often wins. Facing kings with one square between them is the opposition, and the player forced to step aside gives ground. This single idea decides an enormous number of endgames.",points:["Kings facing with one square between = opposition","Whoever must move first gives way","Get your king in front of your pawn, not behind it"],mode:"play",fen:"4k3/8/8/8/8/8/4P3/4K3 w - - 0 1",side:"w",note:"White to play and try to win. King in front of the pawn, take the opposition, and promote."},{id:"t3-square",tier:3,title:"The rule of the square",body:"Can my king catch that runaway pawn? Draw an imaginary square with the pawn's path as one side. If your king can step inside that square on your move, you catch the pawn. If not, it queens. No calculation needed \u2014 just look.",points:["Square drawn from the pawn to its promotion square","King inside the square = pawn is caught","A pawn on its starting rank counts from the 3rd rank, because of the double move"],mode:"read"},{id:"t4-deflection",tier:4,title:"Deflection and decoy",body:"Deflection drags a defender away from its job; a decoy lures a piece onto a bad square. Both usually start with a sacrifice, which is why they are hard to see \u2014 you have to be willing to consider giving something up. Ask: which enemy piece is doing an important job, and can I make it an offer it cannot refuse?",points:["Deflection: pull the defender away","Decoy: drag a piece onto a fork or mating square","Identify the one piece holding the position together"],mode:"read"},{id:"t4-overload",tier:4,title:"Overloaded pieces",body:"A piece defending two things at once is overloaded \u2014 take one and the other falls. This is one of the highest-yield things to scan for, because it hides in plain sight in ordinary positions. Look for enemy pieces with two jobs.",points:["Count the jobs each enemy piece is doing","Two jobs = one job too many","Often the queen or a single rook is doing everything"],mode:"read"},{id:"t4-zwischenzug",tier:4,title:"The in-between move",body:"Zwischenzug: instead of making the recapture your opponent expects, you insert a forcing move first \u2014 a check or a bigger threat \u2014 and only then recapture. It flips countless positions, because most players calculate a sequence and assume the obvious reply.",points:["Before recapturing, look for a check or a bigger threat","Works because opponents assume forced sequences","Also called an intermezzo"],mode:"read"},{id:"t4-structure",tier:4,title:"Pawn structure",body:"Pawns cannot move backwards, so pawn decisions are permanent. Doubled pawns cannot defend each other. An isolated pawn has no neighbours to protect it and must be defended by pieces. A passed pawn \u2014 no enemy pawns ahead of it on its file or either side \u2014 is a long-term winner.",points:["Doubled: two on one file, weak but can open lines for rooks","Isolated: no friendly pawn on either side, needs piece defence","Backward: stuck behind its neighbours on a half-open file","Passed: nothing can stop it becoming a queen"],mode:"read"},{id:"t4-files",tier:4,title:"Open files and the seventh rank",body:"Rooks are useless behind their own pawns and enormous on open files. Get them to files with no pawns, double them if you can, and aim for the seventh rank where they eat pawns and cut the enemy king off. Two rooks on the seventh are usually decisive.",points:["Open file: no pawns at all. Half-open: none of yours.","Double rooks on the file before invading","Rooks on the 7th (or 2nd for Black) are worth a pawn or more"],mode:"read"},{id:"t4-bishops",tier:4,title:"Good bishops, bad bishops, and the pair",body:"A bishop hemmed in by your own pawns on its colour is a bad bishop. Put your pawns on the opposite colour to your bishop. And two bishops together cover both colours, which is why the bishop pair is worth roughly half a pawn extra in open positions.",points:["Pawns on the opposite colour to your bishop","Bishops beat knights in open positions; knights beat bishops in closed ones","The bishop pair is a real, lasting advantage"],mode:"read"},{id:"t4-outpost",tier:4,title:"Outposts",body:"An outpost is a square in enemy territory that their pawns can never attack, protected by one of your pawns. A knight on an outpost on the fifth or sixth rank can be worth more than a rook \u2014 it cannot be chased away, and it paralyses the position around it.",points:["A square no enemy pawn can ever attack","Knights love outposts most of all","Half-open files often create them"],mode:"read"},{id:"t4-repertoire",tier:4,title:"Choosing an opening",body:"You do not need many openings \u2014 you need a few you actually understand. As White, the Italian Game (e4, Nf3, Bc4) or the London System (d4, Bf4, e3) will serve for years. As Black, meet 1.e4 with 1...e5 and 1.d4 with 1...d5. Learn the ideas, not twenty moves of memory.",points:["One reply to 1.e4 and one to 1.d4 is enough","Understand why each move is played","Review your own games' openings, not a database"],mode:"explore",fen:"r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",note:"The Italian Game. White has a centre pawn, two developed pieces and can castle next move."},{id:"t4-queentrade",tier:4,title:"When to trade queens",body:"Trade queens when you are ahead in material, when your king is exposed, or when you want to reach an endgame you understand. Keep them on when you are attacking or when their king is the weaker one. The queen trade is often the single most important decision in a game.",points:["Ahead in material \u2192 trade queens","King exposed \u2192 trade queens","Attacking \u2192 keep them on"],mode:"read"},{id:"t4-rookend",tier:4,title:"Rook endgames",body:"Rook endgames are the most common of all, and two ideas cover most of them. Philidor: if you are defending, put your rook on your third rank until their pawn advances, then drop behind and check from the back. Lucena: if you are attacking, build a bridge with your rook to shield your king from checks.",points:["Rooks belong behind passed pawns \u2014 yours and theirs","Philidor = the defending draw","Lucena = the attacking win","Most rook endings a pawn down are drawable"],mode:"play",fen:"8/8/8/8/8/1k6/1p6/1K5R w - - 0 1",side:"w",note:"White to move. Can you stop the pawn, or is it too late? Play it out and find out."},{id:"t5-candidates",tier:5,title:"Candidate moves",body:"Do not calculate the first move you see. List two or three candidates first, then calculate each one to a quiet position \u2014 a place where nothing is hanging and no forcing move remains. Calculating one line deeply while ignoring a better one is how strong players lose.",points:["List candidates before calculating any of them","Forcing moves first: checks, captures, threats","Calculate to a quiet position, then judge it"],mode:"read"},{id:"t5-prophylaxis",tier:5,title:"Prophylaxis",body:"Prophylaxis means preventing rather than reacting. Before choosing your move, ask what your opponent would play if it were their turn \u2014 then consider stopping it. It feels slow and passive; it is neither. Most strong players spend more time on their opponent's plan than their own.",points:["'If it were their move, what would they play?'","Then decide whether to prevent it","A move that stops their plan is often better than one that advances yours"],mode:"read"},{id:"t5-initiative",tier:5,title:"The initiative",body:"Having the initiative means your opponent is answering you rather than doing what they want. It is worth material in sharp positions, because a defender who is always reacting eventually reacts wrongly. When you have it, keep making threats; when you do not, look for the move that takes it back.",points:["Forcing your opponent to react is itself an advantage","The initiative decays \u2014 use it or lose it","Giving up a pawn for lasting initiative is often sound"],mode:"read"},{id:"t5-attack",tier:5,title:"Attacking a castled king",body:"Three conditions before you attack: you have more pieces near their king than they have defenders, the centre is closed or under control, and you can open a line. Attack with pieces first; pawn storms work only when your own king is safe elsewhere.",points:["Count attackers against defenders before committing","Do not attack on the wing while the centre is loose","Trade off their key defensive piece \u2014 often the f6 knight"],mode:"read"},{id:"t5-sacrifice",tier:5,title:"Real and sham sacrifices",body:"A sham sacrifice is really a calculation \u2014 you give material and get it back with interest inside a few forced moves. A real sacrifice buys something you cannot count, like an exposed king or a permanent bind, and requires judgement. Learn to calculate the first kind before you attempt the second.",points:["Sham: forced and calculable \u2014 calculate it fully","Real: long-term compensation \u2014 judged, not counted","Classic pattern: Bxh7+ needs the knight on f3 and the queen ready"],mode:"read"},{id:"t5-minority",tier:5,title:"The minority attack",body:"Advance two pawns against three on the queenside. The trade that follows leaves your opponent with a weak, backward pawn on an open file, and your rooks pile onto it. It is the classic plan against the Queen's Gambit structure and a good example of playing for a small permanent weakness rather than a knockout.",points:["Fewer pawns attacking more, to create a weakness","The target is usually a backward c-pawn","Slow, strategic, and very hard to defend against"],mode:"read"},{id:"t5-convert",tier:5,title:"Converting a won position",body:"Winning a piece is the easy part. Trade pieces, not pawns. Do not go pawn-grabbing when a simple trade wins. Keep your king safe even when material up. And keep checking for stalemate and back-rank tricks \u2014 most 'unlucky' losses in winning positions are neither unlucky nor tricks.",points:["Up material: trade pieces, keep pawns","Simplify into an endgame you know","Safety first \u2014 an extra piece is only useful if you survive"],mode:"read"},{id:"t5-practical",tier:5,title:"Playing the clock and the person",body:"Practical strength is more than position. Spend time at the critical moments \u2014 pawn structure changes, queen trades, forced sequences \u2014 and move quickly in quiet ones. When short of time, play safe moves rather than clever ones. And after every loss, find the one move where the game turned; that is the lesson.",points:["Spend time on critical moves, not on every move","Low on time: safe and forcing beats clever","Review every loss and name the turning point"],mode:"read"}],bu=[{id:"p1",theme:"Back rank",level:1,fen:"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Ra8#"},{id:"p2",theme:"Back rank",level:1,fen:"6k1/5ppp/8/8/8/8/8/4R1K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Re8#"},{id:"p3",theme:"King & rook",level:1,fen:"1k6/8/1K6/8/8/8/8/7R w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Rh8#"},{id:"p4",theme:"King & queen",level:1,fen:"7k/8/6K1/8/8/8/Q7/8 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Qa8#"},{id:"p5",theme:"King & queen",level:1,fen:"8/8/8/8/8/1k6/7q/K7 b - - 0 1",task:"Black to play. Mate in one.",accept:"mate",answer:"Qa2#"},{id:"p6",theme:"Ladder",level:2,fen:"7k/R7/1R6/8/8/8/8/6K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Rb8#"},{id:"p7",theme:"Opening traps",level:2,fen:"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4",task:"Scholar's Mate. Finish it.",accept:"mate",answer:"Qxf7#"},{id:"p8",theme:"Opening traps",level:2,fen:"rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq - 0 2",task:"Black to play. Mate in one.",accept:"mate",answer:"Qh4#"},{id:"p9",theme:"Bishop & queen",level:2,fen:"7k/8/8/8/8/8/1B4Q1/6K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Qg7#"},{id:"p10",theme:"Two rooks",level:2,fen:"3r2k1/5ppp/8/8/8/8/8/3RR1K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Rxd8#"},{id:"p11",theme:"Smothered",level:3,fen:"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Nf7#"},{id:"p12",theme:"Arabian",level:3,fen:"7k/8/5N2/8/8/8/7R/6K1 w - - 0 1",task:"Mate in one.",accept:"mate",answer:"Rh7#"},{id:"p13",theme:"Fork",level:3,fen:"r3k3/8/8/3N4/8/8/8/6K1 w - - 0 1",task:"Win the rook.",accept:["Nc7+"],answer:"Nc7+ forks the king and rook."},{id:"p14",theme:"Fork",level:3,fen:"3q3k/8/8/6N1/8/8/8/6K1 w - - 0 1",ta @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');

.app{
  --ground:#E7EAF3; --card:#FCFCFE; --ink:#1C2438; --ink2:#5A6480; --line:#CDD4E4;
  --forest:#2E5D52; --mustard:#DFA01B; --rose:#B8514A;
  --t1:#6B84C4; --t2:#3E8577; --t3:#C08A16; --t4:#A8574E; --t5:#6E4E9C;
  --lite:#E6DFCB; --dark:#5E8272;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Public Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  background:var(--ground); color:var(--ink); font-family:var(--body);
  min-height:100vh; padding-bottom:48px; -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3{font-family:var(--disp); letter-spacing:-.02em; margin:0}
.pad{padding:16px; max-width:520px; margin:0 auto}
.muted{color:var(--ink2)} .sm{font-size:13px} .mono{font-family:var(--mono)}

.hdr{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px; background:var(--ink); color:#F4F6FC; max-width:520px; margin:0 auto}
.brand{display:flex; align-items:center; gap:11px}
.brand-mark{font-size:30px; color:var(--mustard); line-height:1}
.hdr h1{font-size:20px; font-weight:800}
.hdr p{margin:2px 0 0; font-size:11px; color:#9AA5C4; letter-spacing:.02em}
.hdr-rating{text-align:right; line-height:1.05}
.hdr-num{display:block; font-family:var(--disp); font-size:26px; font-weight:800; color:var(--mustard)}
.hdr-lab{font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:#9AA5C4}

.tabs{display:flex; gap:2px; background:var(--ink); padding:0 12px 10px; max-width:520px; margin:0 auto}
.tab{flex:1; border:0; background:#2A3450; color:#B9C2DC; font-family:var(--body); font-size:13px;
  padding:9px 4px; border-radius:8px; cursor:pointer; font-weight:600}
.tab.on{background:var(--mustard); color:#231A05}
.tab:focus-visible{outline:2px solid #fff; outline-offset:2px}

/* board */
.board-wrap{position:relative; margin:12px 0}
.board{display:grid; grid-template-columns:repeat(8,1fr); aspect-ratio:1;
  border-radius:10px; overflow:hidden; box-shadow:0 3px 0 var(--line), 0 10px 24px rgba(28,36,56,.14)}
.sq{position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent}
.sq-l{background:var(--lite)} .sq-d{background:var(--dark)}
.sq-last{box-shadow:inset 0 0 0 100px rgba(223,160,27,.28)}
.sq-sel{box-shadow:inset 0 0 0 3px var(--mustard)}
.sq-hi{box-shadow:inset 0 0 0 3px var(--forest)}
.sq-chk{box-shadow:inset 0 0 0 100px rgba(184,81,74,.42)}
.sq-alert{box-shadow:inset 0 0 0 3px var(--rose)}
.pc{line-height:1; pointer-events:none; position:relative; z-index:2}
.pc-w{color:#FBFAF6; text-shadow:0 0 1.5px #1C2438,0 0 1.5px #1C2438,0 0 1.5px #1C2438,0 1px 2px rgba(0,0,0,.35)}
.pc-b{color:#20293C; text-shadow:0 0 1.5px #E9EDF7,0 0 1px #E9EDF7,0 1px 2px rgba(0,0,0,.3)}
.dot{position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(28,36,56,.32)}
.cap-ring{position:absolute; inset:6%; border-radius:50%; border:4px solid rgba(28,36,56,.34)}
.cr,.cf{position:absolute; font-size:9px; font-family:var(--mono); color:rgba(28,36,56,.5); z-index:3}
.cr{top:2px; left:3px} .cf{bottom:1px; right:3px}

.promo-veil{position:absolute; inset:0; background:rgba(28,36,56,.6); display:flex; align-items:center; justify-content:center; border-radius:10px}
.promo{background:var(--card); padding:14px; border-radius:12px; text-align:center}
.promo-t{margin:0 0 8px; font-size:13px; font-weight:600}
.promo-row{display:flex; gap:6px}
.promo-b{width:48px; height:48px; border:1px solid var(--line); background:var(--lite); border-radius:8px; cursor:pointer}

/* lists + tiers */
.tier{margin-bottom:26px}
.tier-hd{display:flex; align-items:center; gap:11px}
.tier-g{font-size:26px; line-height:1}
.tier-tt{flex:1}
.tier-tt h2{font-size:17px; font-weight:800}
.tier-count{font-family:var(--mono); font-size:12px; color:var(--ink2)}
.tier-bar{height:4px; background:var(--line); border-radius:2px; margin:8px 0 10px; overflow:hidden}
.tier-bar div{height:100%; border-radius:2px; transition:width .3s}
.llist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
.lrow{width:100%; display:flex; align-items:center; gap:9px; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:9px; padding:11px 12px; cursor:pointer; font-family:var(--body); font-size:14px; color:var(--ink)}
.lrow:hover{border-color:var(--ink2)}
.lrow-done{background:#F0F4F1; border-color:#BFD3C6}
.lcheck{width:15px; color:var(--forest); font-weight:700}
.ltitle{flex:1}
.lmode{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink2)}

.back{background:none; border:0; color:var(--ink2); font-family:var(--body); font-size:13px; cursor:pointer; padding:0 0 10px}
.lesson h2{font-size:24px; font-weight:800; margin:2px 0 10px; line-height:1.12}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:600; margin:0}
.body{font-size:15px; line-height:1.55; margin:0 0 12px}
.pts{margin:0 0 4px; padding-left:0; list-style:none; border-left:3px solid var(--mustard)}
.pts li{padding:4px 0 4px 12px; font-size:14px; line-height:1.45}
.lesson-board{margin-top:16px}
.task{font-size:15px; font-weight:600; margin:0 0 6px}
.note{font-size:13px; color:var(--ink2); margin:0 0 4px; font-style:italic}
.tick{font-weight:400; font-size:12px; color:var(--forest)}

.btn{background:var(--forest); color:#F2F7F4; border:0; border-radius:9px; padding:11px 16px;
  font-family:var(--body); font-size:14px; font-weight:600; cursor:pointer}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.tiny{padding:6px 10px; font-size:12px}
.btn:disabled{opacity:.4; cursor:default}
.btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0}

.good{color:var(--forest); font-weight:600; font-size:14px; margin:8px 0}
.bad{color:var(--rose); font-weight:600; font-size:14px; margin:8px 0}
.big{font-size:17px; font-family:var(--disp)}
.hint{background:#FBF3DE; border-left:3px solid var(--mustard); padding:9px 11px; font-size:14px; margin:8px 0; border-radius:0 6px 6px 0}
.coach{background:#FAEDEC; border-left:3px solid var(--rose); padding:9px 11px; font-size:14px; margin:8px 0; border-radius:0 6px 6px 0}
.warn{max-width:520px; margin:8px auto; padding:0 16px; color:var(--rose); font-size:13px}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.chip{background:var(--card); border:1px solid var(--line); border-radius:99px; padding:6px 11px;
  font-family:var(--body); font-size:12px; cursor:pointer; color:var(--ink)}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.puzhd{display:flex; justify-content:space-between; color:var(--ink2); margin-bottom:6px}

.bots{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0}
.botcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 11px;
  text-align:left; cursor:pointer; display:grid; gap:2px; font-family:var(--body); color:var(--ink)}
.botcard:hover{border-color:var(--forest)}
.botface{font-size:24px; line-height:1}
.botface.sm2{font-size:20px}
.botname{font-family:var(--disp); font-weight:700; font-size:15px}
.botelo{font-family:var(--mono); font-size:12px; color:var(--mustard)}
.botline{font-size:11px; color:var(--ink2); line-height:1.3}
.check{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink2); margin-top:6px}
.playtop{display:flex; justify-content:space-between; align-items:center}
.oppo{display:flex; gap:9px; align-items:center}
.taken{font-size:15px; min-height:20px; margin:4px 0; color:var(--ink2); letter-spacing:1px}
.moves{margin-top:14px; font-size:13px}
.moves summary{cursor:pointer; color:var(--ink2)}
.mvlist{margin-top:8px; font-family:var(--mono); font-size:12px; max-height:180px; overflow:auto}
.mvrow{display:grid; grid-template-columns:34px 1fr 1fr; padding:2px 0}
.mvn{color:var(--ink2)}

/* ladder \u2014 the signature */
.progwrap{display:flex; gap:18px; align-items:stretch}
.ladder{display:flex; flex-direction:column; gap:8px; width:112px; flex:none}
.ladder-track{position:relative; flex:1; min-height:230px; background:var(--card);
  border:1px solid var(--line); border-radius:11px; display:flex; flex-direction:column;
  justify-content:space-between; padding:9px 8px; overflow:hidden}
.ladder-fill{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(to top,rgba(223,160,27,.30),rgba(223,160,27,.05)); transition:height .5s}
.rung{display:flex; align-items:center; gap:6px; position:relative; z-index:2}
.rung-g{font-size:17px; line-height:1}
.rung-b{font-family:var(--mono); font-size:10px; color:var(--ink2)}
.ladder-token{position:absolute; right:7px; z-index:3; width:28px; height:28px; border-radius:50%;
  background:var(--ink); color:var(--mustard); display:flex; align-items:center; justify-content:center;
  font-size:17px; transition:bottom .5s; box-shadow:0 2px 6px rgba(28,36,56,.3)}
.ladder-cap{text-align:center; line-height:1.15}
.ladder-cap strong{font-family:var(--disp); font-size:23px; display:block}
.ladder-cap span{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink2)}
.stats{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start}
.stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px}
.stat strong{font-family:var(--disp); font-size:23px; display:block; line-height:1}
.stat span{font-size:11px; color:var(--ink2)}
.nextup{margin:16px 0; font-size:14px; line-height:1.5}
.sec{font-size:16px; font-weight:800; margin:18px 0 6px}

@media (prefers-reduced-motion: reduce){ .app *{transition:none !important} }
@media (max-width:360px){ .bots{grid-template-columns:1fr} }
